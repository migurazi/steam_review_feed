services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - STEAM_API_KEY=${STEAM_API_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      - NODE_ENV=production
    volumes:
      # SQLite DB 파일 영속화
      - ./data:/app/data
      # 이벤트 로그 영속화
      - ./logs:/app/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # Nginx 리버스 프록시 (SSL 종료 + SSE 프록시)
